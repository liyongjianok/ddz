services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ddz
      POSTGRES_PASSWORD: ddz
      POSTGRES_DB: ddz
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddz -d ddz"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: docker
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://ddz:ddz@postgres:5432/ddz?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me
      ACCESS_TOKEN_TTL: 24h
      RECONNECT_TTL: 5m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  postgres_data:
  redis_data:
